<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Monitor TUI</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--text); font-family:var(--font-mono); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .net { fill:var(--series-net); }
  .mid { fill:var(--level-mid); }
  .low { fill:var(--level-low); }
  .pow { fill:var(--series-power); }
  .dot { fill:var(--dim); }
  .col { rx:var(--radius-term); }
  .words { position:absolute; left:32px; bottom:32px; max-width:440px; }
  .name { margin:0; font-size:100px; line-height:.95; font-weight:700; letter-spacing:-.02em; color:var(--text); font-variant-ligatures:none; }
  .tag { margin:8px 0 0 4px; font-size:13px; line-height:20px; color:var(--dim); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      series-net 96×232 · level-mid 72×160 · level-low 48×72 · series-power 120×200, square (radius-term), all bleeding off the bottom edge — ≈30% of 960×288
  arrangement unequal columns rising from one baseline, read left to right like the bars of a history graph, window-pad-x (8px) gutters
  pattern     "precise, technical, mono": a 12×4 dot grid in dim at 2 × window-pad-x pitch, the unlit braille dots above the graph
  scales      window-pad-x 8px gutters and pitch, page-pad-y 32px text inset, radius-term 0
-->
<rect class="net col" x="24" y="56" width="96" height="240"/>
<rect class="mid col" x="128" y="128" width="72" height="168"/>
<rect class="low col" x="208" y="216" width="48" height="80"/>
<rect class="pow col" x="264" y="88" width="120" height="208"/>
<g class="dot">
<circle cx="296" cy="16" r="2"/><circle cx="312" cy="16" r="2"/><circle cx="328" cy="16" r="2"/><circle cx="344" cy="16" r="2"/><circle cx="360" cy="16" r="2"/><circle cx="376" cy="16" r="2"/><circle cx="392" cy="16" r="2"/><circle cx="408" cy="16" r="2"/><circle cx="424" cy="16" r="2"/><circle cx="440" cy="16" r="2"/><circle cx="456" cy="16" r="2"/><circle cx="472" cy="16" r="2"/>
<circle cx="296" cy="32" r="2"/><circle cx="312" cy="32" r="2"/><circle cx="328" cy="32" r="2"/><circle cx="344" cy="32" r="2"/><circle cx="360" cy="32" r="2"/><circle cx="376" cy="32" r="2"/><circle cx="392" cy="32" r="2"/><circle cx="408" cy="32" r="2"/><circle cx="424" cy="32" r="2"/><circle cx="440" cy="32" r="2"/><circle cx="456" cy="32" r="2"/><circle cx="472" cy="32" r="2"/>
<circle cx="296" cy="48" r="2"/><circle cx="312" cy="48" r="2"/><circle cx="328" cy="48" r="2"/><circle cx="344" cy="48" r="2"/><circle cx="360" cy="48" r="2"/><circle cx="376" cy="48" r="2"/><circle cx="392" cy="48" r="2"/><circle cx="408" cy="48" r="2"/><circle cx="424" cy="48" r="2"/><circle cx="440" cy="48" r="2"/><circle cx="456" cy="48" r="2"/><circle cx="472" cy="48" r="2"/>
<circle cx="296" cy="64" r="2"/><circle cx="312" cy="64" r="2"/><circle cx="328" cy="64" r="2"/><circle cx="344" cy="64" r="2"/><circle cx="360" cy="64" r="2"/><circle cx="376" cy="64" r="2"/><circle cx="392" cy="64" r="2"/><circle cx="408" cy="64" r="2"/><circle cx="424" cy="64" r="2"/><circle cx="440" cy="64" r="2"/><circle cx="456" cy="64" r="2"/><circle cx="472" cy="64" r="2"/>
</g>
</svg>
</div>
<div class="words">
<h1 class="name">Monitor<br>TUI</h1>
<p class="tag">mactop in heavy frames, coloured by your Alacritty palette</p>
</div>
</div>
</body>
</html>
